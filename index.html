<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주식회사 일인자 — 1STMAN</title>
<meta name="description" content="1STMAN CO., LTD. — Good things, well introduced.">
<meta property="og:title" content="주식회사 일인자 — 1STMAN">
<meta property="og:description" content="Good things, well introduced.">
<meta property="og:image" content="https://1stman.kr/og.png">
<meta property="og:url" content="https://1stman.kr/">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700&family=Hahmlet:wght@500;700&family=Song+Myung&display=swap" rel="stylesheet">
<style>
:root{--ink:#000;--paper:#fff;--grey:#767676;--pad:clamp(20px,6vw,36px);--gungsuh:'Gungsuh','궁서','GungSeo','궁서체','Song Myung',serif;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:'Inter Tight','Helvetica Neue',Helvetica,Arial,sans-serif;font-feature-settings:'tnum' 1;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none;border-bottom:1px solid currentColor}
a:hover{border-bottom-width:2px}

/* one vertical sheet, centred on wide screens */
.page{width:100%;max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:var(--pad) var(--pad) 10px;display:grid;grid-template-rows:auto 1fr auto;gap:16px}

.top{padding-top:14px;position:relative}
.slogan{margin:0;font-size:clamp(38px,11vw,52px);line-height:1.02;font-weight:700;letter-spacing:-0.035em}
.line{display:block;overflow:hidden;padding-bottom:0.08em}
.line > span{display:block}

.stage{display:flex;flex-direction:column}
.portrait{--s:min(46vh,80vw,370px);width:var(--s);height:var(--s);margin:auto;position:relative;top:calc(var(--s) * -0.08);display:flex;align-items:center;justify-content:center}
.nod{height:var(--s);width:auto;display:block;transform-origin:50% 50%;animation:nod 6s ease-in-out infinite}
.sub{margin:0;text-align:right;font-size:16px;line-height:1.25;font-weight:500;letter-spacing:-0.01em}

.base{margin-top:22px;padding-top:14px;position:relative;display:grid;gap:10px}
.info{margin:0;padding:0;list-style:none;font-size:15.5px;line-height:1.35;letter-spacing:-0.005em}
.info li{display:flex;gap:10px}
.info li{padding:2px 0}
.info li > span:first-child{flex:0 0 72px;color:var(--grey)}
.logo{justify-self:end;text-align:right;line-height:1}
.logo .ko{display:block;font-family:var(--gungsuh);font-weight:400;font-size:17px;letter-spacing:0.06em}
.logo .ko i{font-style:normal;margin-right:0.3em}
.logo .en{display:block;margin-top:4px;font-size:10px;letter-spacing:0.14em;font-weight:500}

@keyframes nod{0%,33.3%{transform:rotate(30deg)}36%{transform:rotate(24deg)}39%{transform:rotate(32deg)}41.7%,91.7%{transform:rotate(30deg)}94.4%{transform:rotate(24deg)}97.4%{transform:rotate(32deg)}100%{transform:rotate(30deg)}}

/* ---------- motion ---------- */
.intro{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:var(--paper);pointer-events:none;animation:introOut .6s var(--ease) 1.4s forwards}
.intro span{font-family:var(--gungsuh);font-size:clamp(36px,11vw,64px);letter-spacing:0.06em;white-space:nowrap;animation:introIn .8s var(--ease) both}
@keyframes introIn{from{opacity:0;letter-spacing:0.22em;filter:blur(6px)}to{opacity:1;letter-spacing:0.06em;filter:none}}
@keyframes introOut{to{opacity:0;transform:scale(1.04);visibility:hidden}}

/* rules draw left to right */
.top::before,.base::before{content:"";position:absolute;left:0;top:0;height:1px;width:100%;background:var(--ink);transform-origin:0 50%;transform:scaleX(0);animation:draw .9s var(--ease) both}
.top::before{animation-delay:1.85s}
.base::before{animation-delay:2.7s}
@keyframes draw{to{transform:scaleX(1)}}

/* slogan lines slide up out of a mask */
.line > span{transform:translateY(105%);animation:up .9s var(--ease) both}
.l1 > span{animation-delay:1.95s}
.l2 > span{animation-delay:2.07s}
@keyframes up{to{transform:none}}

/* face drops in with a spring, then starts nodding */
.portrait{animation:pop .9s cubic-bezier(.34,1.56,.64,1) 2.2s both}
@keyframes pop{from{opacity:0;transform:translateY(-28px) scale(.82)}to{opacity:1;transform:none}}
.nod{animation-delay:3.1s;animation-fill-mode:both}

/* sub line comes into focus */
.sub{animation:focus .8s var(--ease) 2.65s both}
@keyframes focus{from{opacity:0;filter:blur(8px);transform:translateX(12px)}to{opacity:1;filter:none;transform:none}}

/* info rows rise one by one */
.info li{animation:rise .7s var(--ease) both;animation-delay:calc(2.85s + var(--i,0) * 80ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* logo tracks in */
.logo{animation:track 1s var(--ease) 3.1s both}
@keyframes track{from{opacity:0;letter-spacing:0.3em}to{opacity:1;letter-spacing:normal}}

@media (prefers-reduced-motion: reduce){
  .intro{display:none}
  .line>span,.portrait,.sub,.info li,.logo,.top::before,.base::before{animation:none;transform:none;opacity:1;filter:none}
  .nod{animation:none;transform:rotate(30deg)}
}
</style>
</head>
<body>
<div class="intro" aria-hidden="true"><span>주식회사 일인자</span></div>
<div class="page">

  <header class="top">
    <h1 class="slogan"><span class="line l1"><span>Good things,</span></span><span class="line l2"><span>well introduced.</span></span></h1>
  </header>

  <main class="stage">
    <div class="portrait">
      <img class="nod" src="portrait.png" alt="Line drawing of An Se Hwan">
    </div>
    <p class="sub">We tried it first.<br>You&rsquo;re welcome.</p>
  </main>

  <footer class="base">
    <ul class="info">
      <li style="--i:0"><span>Address</span><span>B1, 35, Dosan-daero 85-gil,<br>Gangnam-gu, Seoul, Korea</span></li>
      <li style="--i:1"><span>E-mail</span><span><a href="mailto:ash@1stman.kr">ash@1stman.kr</a></span></li>
      <li style="--i:2"><span>CEO</span><span>An Se Hwan</span></li>
    </ul>
    <div class="logo"><span class="ko"><i>주식회사</i>일인자</span><span class="en">1STMAN CO., LTD.</span></div>
  </footer>

</div>
</body>
</html>
