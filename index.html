<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주식회사 일인자 — 1STMAN</title>
<meta name="description" content="1STMAN CO., LTD. — Import & Distribution, Seoul. Good things, well introduced.">
<meta property="og:title" content="주식회사 일인자 — 1STMAN">
<meta property="og:description" content="Good things, well introduced.">
<meta property="og:image" content="https://1stman.kr/og.png">
<meta property="og:url" content="https://1stman.kr/">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700&family=Gothic+A1:wght@900&family=Song+Myung&display=swap" rel="stylesheet">
<style>
:root{--ink:#000;--paper:#fff;--grey:#767676;--pad:clamp(20px,6vw,36px);--gungsuh:'Gungsuh','궁서','GungSeo','궁서체','Song Myung',serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:'Inter Tight','Helvetica Neue',Helvetica,Arial,sans-serif;font-feature-settings:'tnum' 1;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none;border-bottom:1px solid currentColor}
a:hover{border-bottom-width:2px}

/* one vertical sheet, centred on wide screens */
.page{width:100%;max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:var(--pad);display:grid;grid-template-rows:auto 1fr auto auto;gap:20px}

.top{border-top:1px solid var(--ink);padding-top:14px}
.slogan{margin:0;font-size:clamp(38px,11vw,52px);line-height:1;font-weight:700;letter-spacing:-0.035em}

.stage{display:flex;flex-direction:column;justify-content:center}
.portrait{--s:min(48vh,72vw,340px);width:var(--s);height:var(--s);margin:0 auto;display:flex;align-items:center;justify-content:center}
.nod{height:var(--s);width:auto;display:block;transform-origin:50% 50%;animation:nod 6s ease-in-out infinite}
.after{margin-top:8px}
.sub{margin:10px 0 0;text-align:right;font-size:14px;line-height:1.35;font-weight:500}

.info{border-top:1px solid var(--ink);padding-top:12px;margin:0;list-style:none;padding-left:0;font-size:12px;line-height:1.5}
.info li{display:flex;gap:10px}
.info li span:first-child{flex:0 0 58px;color:var(--grey)}

.logo{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:10px;border-top:1px solid #d6d6d6}
.logo b{font-family:'Gothic A1','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-weight:900;font-size:17px;letter-spacing:-0.05em}
.logo small{font-size:10px;letter-spacing:0.12em;font-weight:500}
@keyframes nod{0%,33.3%{transform:rotate(30deg)}36%{transform:rotate(24deg)}39%{transform:rotate(32deg)}41.7%,91.7%{transform:rotate(30deg)}94.4%{transform:rotate(24deg)}97.4%{transform:rotate(32deg)}100%{transform:rotate(30deg)}}

/* intro sequence */
.intro{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:var(--paper);pointer-events:none;animation:introOut .55s ease 1.4s forwards}
.intro span{font-family:var(--gungsuh);font-size:clamp(36px,11vw,64px);letter-spacing:0.06em;white-space:nowrap;animation:introIn .7s ease both}
@keyframes introIn{from{opacity:0;letter-spacing:0.18em}to{opacity:1;letter-spacing:0.06em}}
@keyframes introOut{to{opacity:0;visibility:hidden}}
.portrait{animation:pop .7s cubic-bezier(.2,1.5,.4,1) 1.75s both}
@keyframes pop{from{opacity:0;transform:scale(.55) translateY(24px)}to{opacity:1;transform:none}}
.nod{animation-delay:2.6s;animation-fill-mode:both}
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(2.15s + var(--i,0) * 90ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.top,.info{animation:rule .6s ease 2.05s both}
@keyframes rule{from{border-top-color:transparent}to{border-top-color:var(--ink)}}
@media (prefers-reduced-motion: reduce){.intro{display:none}.portrait,.rise,.top,.info{animation:none}.nod{animation:none;transform:rotate(30deg)}}
</style>
</head>
<body>
<div class="intro" aria-hidden="true"><span>주식회사 일인자</span></div>
<div class="page">

  <header class="top">
    <p class="slogan rise" style="--i:0">Good things,</p>
  </header>

  <main class="stage">
    <div class="portrait">
      <img class="nod" src="portrait.png" alt="Line drawing of An Se Hwan">
    </div>
    <p class="slogan after rise" style="--i:1">well introduced.</p>
    <p class="sub rise" style="--i:2">Tried first. Told well.<br>Shared with people of taste.</p>
  </main>

  <ul class="info">
    <li class="rise" style="--i:3"><span>CEO</span><span>An Se Hwan</span></li>
    <li class="rise" style="--i:4"><span>E-mail</span><span><a href="mailto:ash@1stman.kr">ash@1stman.kr</a></span></li>
    <li class="rise" style="--i:5"><span>Address</span><span>B1, 35, Dosan-daero 85-gil,<br>Gangnam-gu, Seoul, Korea</span></li>
  </ul>

  <footer class="logo rise" style="--i:6"><b>주식회사 일인자</b><small>1STMAN CO., LTD.</small></footer>

</div>
</body>
</html>
