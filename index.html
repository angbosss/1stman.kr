<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주식회사 일인자 — 1STMAN</title>
<meta name="description" content="1STMAN CO., LTD. — Import & Distribution, Seoul. Good things, well introduced.">
<meta property="og:title" content="주식회사 일인자 — 1STMAN">
<meta property="og:description" content="Good things, well introduced.">
<meta property="og:image" content="https://1stman.kr/og.png">
<meta property="og:url" content="https://1stman.kr/">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700&family=Song+Myung&display=swap" rel="stylesheet">
<style>
:root{--ink:#000;--paper:#fff;--grey:#767676;--pad:clamp(20px,6vw,36px);--gungsuh:'Gungsuh','궁서','GungSeo','궁서체','Song Myung',serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:'Inter Tight','Helvetica Neue',Helvetica,Arial,sans-serif;font-feature-settings:'tnum' 1;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none;border-bottom:1px solid currentColor}
a:hover{border-bottom-width:2px}

/* one vertical card, centred on wide screens */
.page{width:100%;max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:var(--pad);display:grid;grid-template-rows:auto 1fr auto;gap:24px}

.top{border-top:1px solid var(--ink);padding-top:14px}
.slogan{margin:0;font-size:clamp(34px,10vw,46px);line-height:1;font-weight:700;letter-spacing:-0.035em}

.stage{display:flex;align-items:center;justify-content:center}
.portrait{--s:min(58vh,78vw,380px);width:var(--s);height:var(--s);display:flex;align-items:center;justify-content:center}
.nod{height:var(--s);width:auto;display:block;transform-origin:50% 50%;animation:nod 6s ease-in-out infinite}

.card{border-top:1px solid var(--ink);padding-top:14px;display:grid;gap:18px}
.name{font-family:var(--gungsuh);font-size:26px;line-height:1.1;letter-spacing:0.04em;margin:0}
.name small{display:block;margin-top:6px;font-family:'Inter Tight','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:0.08em;font-weight:500}
.info{display:grid;grid-template-columns:72px 1fr;column-gap:12px;row-gap:8px;margin:0;font-size:12px;line-height:1.4}
.info dt{color:var(--grey)}
.info dd{margin:0}

@keyframes nod{0%,33.3%{transform:rotate(30deg)}36%{transform:rotate(24deg)}39%{transform:rotate(32deg)}41.7%,91.7%{transform:rotate(30deg)}94.4%{transform:rotate(24deg)}97.4%{transform:rotate(32deg)}100%{transform:rotate(30deg)}}

/* intro sequence */
.intro{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:var(--paper);pointer-events:none;animation:introOut .55s ease 1.4s forwards}
.intro span{font-family:var(--gungsuh);font-size:clamp(36px,11vw,64px);letter-spacing:0.06em;white-space:nowrap;animation:introIn .7s ease both}
@keyframes introIn{from{opacity:0;letter-spacing:0.18em}to{opacity:1;letter-spacing:0.06em}}
@keyframes introOut{to{opacity:0;visibility:hidden}}
.portrait{animation:pop .7s cubic-bezier(.2,1.5,.4,1) 1.75s both}
@keyframes pop{from{opacity:0;transform:scale(.55) translateY(24px)}to{opacity:1;transform:none}}
.nod{animation-delay:2.6s;animation-fill-mode:both}
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(2.15s + var(--i,0) * 90ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.top,.card{animation:rule .6s ease 2.05s both}
@keyframes rule{from{border-top-color:transparent}to{border-top-color:var(--ink)}}
@media (prefers-reduced-motion: reduce){.intro{display:none}.portrait,.rise,.top,.card{animation:none}.nod{animation:none;transform:rotate(30deg)}}
</style>
</head>
<body>
<div class="intro" aria-hidden="true"><span>주식회사 일인자</span></div>
<div class="page">

  <header class="top">
    <p class="slogan rise" style="--i:0">Good things,<br>well introduced.</p>
  </header>

  <main class="stage">
    <div class="portrait">
      <img class="nod" src="portrait.png" alt="Line drawing of An Se Hwan">
    </div>
  </main>

  <footer class="card">
    <p class="name rise" style="--i:2">주식회사 일인자<small>1STMAN CO., LTD.</small></p>
    <dl class="info">
      <dt class="rise" style="--i:3">Business</dt><dd class="rise" style="--i:3">Import &amp; Distribution, since 2008</dd>
      <dt class="rise" style="--i:4">CEO</dt><dd class="rise" style="--i:4">An Se Hwan · 안세환</dd>
      <dt class="rise" style="--i:5">E-mail</dt><dd class="rise" style="--i:5"><a href="mailto:ash@1stman.kr">ash@1stman.kr</a></dd>
      <dt class="rise" style="--i:6">Address</dt><dd class="rise" style="--i:6">B1, 35, Dosan-daero 85-gil,<br>Gangnam-gu, Seoul, Korea</dd>
    </dl>
  </footer>

</div>
</body>
</html>
