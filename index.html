<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1STMAN</title>
<meta name="description" content="1STMAN CO., LTD. — An Se Hwan, Seoul.">
<meta property="og:title" content="1STMAN">
<meta property="og:description" content="The man who will change the world. Just so you know.">
<meta property="og:image" content="https://1stman.kr/og.png">
<meta property="og:url" content="https://1stman.kr/">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#FFFFFF;color:#000000}
body{font-family:'Gothic A1','Apple SD Gothic Neo','Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:5px}
.page{width:100%;min-height:100vh;min-height:100dvh;box-sizing:border-box;padding:24px 32px;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.bar{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px 16px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.12em}
.bar a{display:inline-flex;align-items:center;min-height:44px}
main{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.nod{height:clamp(180px,34vh,380px);width:auto;display:block;transform-origin:50% 96%;animation:nod 6s ease-in-out infinite}
h1{margin:0;font-weight:900;font-size:clamp(64px,min(22vw,38vh),340px);line-height:0.92;letter-spacing:-0.05em}
p{margin:20px 0 0;font-weight:500;font-size:clamp(18px,2vw,26px);line-height:1.5;letter-spacing:-0.01em}
@keyframes nod{0%,33.3%{transform:rotate(0deg)}36%{transform:rotate(-6deg)}39%{transform:rotate(2deg)}41.7%,91.7%{transform:rotate(0deg)}94.4%{transform:rotate(-6deg)}97.4%{transform:rotate(2deg)}100%{transform:rotate(0deg)}}
@media (prefers-reduced-motion: reduce){.nod{animation:none}}
@media (max-width:480px){.page{padding:20px 16px}}
</style>
</head>
<body>
<div class="page">
  <header class="bar">
    <span>일인자 · 1STMAN CO., LTD.</span>
    <span>SEOUL</span>
  </header>
  <main>
    <img class="nod" src="portrait.png" alt="Line drawing of An Se Hwan">
    <h1>1STMAN</h1>
    <p>The man who will change the world.<br>Just so you know.</p>
  </main>
  <footer class="bar">
    <span>AN SE HWAN · 안세환</span>
    <a href="mailto:ash@1stman.kr">ash@1stman.kr</a>
  </footer>
</div>
</body>
</html>
